name: chapterly
description: "Chapterly for Windows: a private book tracker that syncs with the Chapterly phone app over your home Wi-Fi."
publish_to: 'none'

# Keep in step with appVersion in lib/data/app_info.dart.
version: 1.5.0+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 2.4 and newer build and bundle sqlite3.dll by themselves (sqlite3 v3).
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.1
  http: ^1.2.2
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  # 0.9 renamed its whole API; 0.7 is the one this app is written for.
  desktop_drop: ^0.7.1
  # Shrinks pictures used as covers to small JPEGs.
  image: ^4.5.0
  # The printable year in review.
  pdf: ^3.11.3
  # Reads a picture from the clipboard (Ctrl+V for a cover).
  pasteboard: ^0.5.0
  # The small reading-timer window that stays on top.
  window_manager: ^0.5.1
  # Audiobooks: just_audio plays them through media_kit on Windows.
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  # The reader: EPUB books are zips of web pages, shown chapter by chapter;
  # PDF through PDFium.
  archive: ^4.5.0
  xml: ">=6.5.0 <8.0.0"
  flutter_widget_from_html_core: ^0.17.4
  pdfrx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
